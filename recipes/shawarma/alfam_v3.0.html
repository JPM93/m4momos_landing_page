<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>🔥 Alfam Shawarma • MFM Final v3.0</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #1a0a0a 0%, #1e0e0e 100%);
            min-height: 100vh;
            padding: 1.5rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            max-width: 1000px;
            width: 100%;
            background: #fef7ed;
            border-radius: 3rem 3rem 2.5rem 2.5rem;
            box-shadow: 0 30px 50px rgba(180, 30, 30, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.6);
            padding: 2rem 1.8rem;
            border: 2px solid #ef4444;
        }

        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1.9rem;
            font-weight: 800;
            color: #991b1b;
            text-shadow: 2px 2px 0 #fca5a5;
            margin-bottom: 0.2rem;
            letter-spacing: -0.5px;
        }

        .subhead {
            text-align: center;
            color: #7f1d1d;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: #fee2e2;
            display: inline-block;
            padding: 0.3rem 1.8rem;
            border-radius: 2rem;
            margin-left: auto;
            margin-right: auto;
            width: fit-content;
            font-size: 0.9rem;
            border: 1px solid #f87171;
        }

        .control-panel {
            background: #1c0a0a;
            border-radius: 2rem;
            padding: 1.5rem 1.2rem;
            margin-bottom: 1.8rem;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6), 0 10px 15px rgba(180, 30, 30, 0.3);
            color: #f5f5f4;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #292524;
            padding: 0.5rem 1.2rem;
            border-radius: 3rem;
        }

        .input-group label {
            font-weight: 700;
            color: #fca5a5;
            font-size: 1.2rem;
        }

        .input-group input {
            width: 85px;
            padding: 0.7rem 0.5rem;
            text-align: center;
            font-weight: 800;
            font-size: 1.4rem;
            background: #fef7ed;
            border: 2px solid #ef4444;
            border-radius: 1.5rem;
            color: #7f1d1d;
            outline: none;
        }

        .btn {
            background: linear-gradient(to bottom, #f87171, #dc2626);
            border: none;
            color: white;
            font-weight: 800;
            padding: 0.75rem 1.8rem;
            border-radius: 3rem;
            font-size: 1rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.5);
            border: 1px solid #fca5a5;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background: linear-gradient(to bottom, #ef4444, #991b1b);
            transform: translateY(-1px);
        }

        .btn-settings {
            background: #4b5563;
            border-color: #9ca3af;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-settings:hover {
            background: #6b7280;
        }

        .btn-export {
            background: #15803d;
            border-color: #86efac;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-export:hover {
            background: #166534;
        }

        .btn-import {
            background: #b45309;
            border-color: #fcd34d;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-import:hover {
            background: #92400e;
        }

        .tabs {
            display: flex;
            gap: 0.4rem;
            justify-content: center;
            margin: 1.5rem 0 1rem;
            flex-wrap: wrap;
        }

        .tab {
            background: #d6d3d1;
            border: none;
            padding: 0.55rem 1rem;
            border-radius: 2.5rem;
            font-weight: 700;
            cursor: pointer;
            color: #44403c;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
            font-size: 0.8rem;
        }

        .tab.active {
            background: #dc2626;
            color: white;
            box-shadow: 0 0 18px #f87171;
        }

        .recipe-card {
            background: #fffbf0;
            border-radius: 2rem;
            padding: 1.5rem 1.2rem;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.25);
            border: 1px solid #fca5a5;
            max-height: 65vh;
            overflow-y: auto;
        }

        .recipe-card::-webkit-scrollbar {
            width: 8px;
        }

        .recipe-card::-webkit-scrollbar-track {
            background: #fee2e2;
            border-radius: 1rem;
        }

        .recipe-card::-webkit-scrollbar-thumb {
            background: #ef4444;
            border-radius: 1rem;
        }

        .ingredient-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .ing-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffffd6;
            padding: 0.5rem 0.8rem;
            border-radius: 1rem;
            font-size: 0.9rem;
            border-bottom: 1px dashed #fca5a5;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .ing-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            flex: 1;
        }

        .ing-name {
            font-weight: 600;
            color: #3b2f1e;
            min-width: 130px;
        }

        .ing-qty {
            font-weight: 800;
            background: #fee2e2;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            color: #991b1b;
            font-size: 0.85rem;
        }

        .ing-cost {
            font-weight: 700;
            color: #16a34a;
            background: #dcfce7;
            padding: 0.15rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.8rem;
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.15rem 0.6rem;
            border-radius: 1.5rem;
            cursor: pointer;
            background: #d1d5db;
            color: #374151;
            border: 1px solid transparent;
            margin-left: 0.3rem;
        }

        .status-badge.available {
            background: #bbf7d0;
            color: #166534;
            border-color: #86efac;
        }

        .status-badge.not-available {
            background: #fecaca;
            color: #991b1b;
            border-color: #fca5a5;
        }

        .cost-summary {
            background: #fef2f2;
            border: 2px solid #ef4444;
            border-radius: 1.2rem;
            padding: 0.8rem 1rem;
            margin: 0.8rem 0;
            font-weight: 600;
            color: #7f1d1d;
        }

        .total-cost-box {
            background: linear-gradient(135deg, #1c0a0a, #292524);
            color: #fca5a5;
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin: 1rem 0;
            font-size: 1.1rem;
            border: 2px solid #ef4444;
        }

        .step-container {
            background: #fff7ed;
            border-radius: 1.5rem;
            padding: 1rem;
            margin: 1rem 0;
            border: 2px solid #fca5a5;
        }

        .status-toggle-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }

        .status-toggle-bar button {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 0.25rem 0.8rem;
            border-radius: 1.5rem;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .section-title {
            font-weight: 800;
            font-size: 1.1rem;
            margin: 1rem 0 0.6rem;
            color: #991b1b;
            border-left: 6px solid #ef4444;
            padding-left: 0.8rem;
            background: linear-gradient(to right, #fee2e2, transparent);
        }

        .tip-box {
            background: #fef2f2;
            border: 2px solid #f87171;
            border-radius: 1rem;
            padding: 0.8rem 1rem;
            margin: 0.8rem 0;
            font-size: 0.85rem;
            color: #7f1d1d;
        }

        .secret-box {
            background: #1c0a0a;
            color: #fca5a5;
            border-radius: 1.2rem;
            padding: 0.8rem 1rem;
            margin: 0.8rem 0;
            font-size: 0.85rem;
            border: 1px solid #ef4444;
        }

        .method-box {
            background: #fff7ed;
            border: 2px solid #f87171;
            border-radius: 1.2rem;
            padding: 1rem;
            margin: 0.8rem 0;
        }

        .method-box h3 {
            color: #991b1b;
            margin-bottom: 0.5rem;
        }

        .method-box ol,
        .method-box ul {
            padding-left: 1.5rem;
            color: #3b2f1e;
        }

        .method-box ol li,
        .method-box ul li {
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
        }

        .sop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.5rem;
            margin: 0.8rem 0;
        }

        .sop-item {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 0.8rem;
            padding: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #7f1d1d;
            text-align: center;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #991b1b;
            margin-top: 1rem;
        }

        .settings-modal {
            scrollbar-width: thin;
            scrollbar-color: #ef4444 #fee2e2;
        }

        .settings-modal::-webkit-scrollbar {
            width: 10px;
        }

        .settings-modal::-webkit-scrollbar-track {
            background: #fee2e2;
            border-radius: 1rem;
        }

        .settings-modal::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #f87171, #dc2626);
            border-radius: 1rem;
            border: 2px solid #fee2e2;
        }

        .settings-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .settings-overlay.open {
            display: flex;
        }

        .settings-modal {
            background: #fff7ed;
            border-radius: 2rem;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
            border: 2px solid #ef4444;
        }

        .settings-modal h2 {
            color: #991b1b;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: #dc2626;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: #b91c1c;
        }

        .settings-item {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            background: white;
            padding: 0.7rem;
            border-radius: 1rem;
            margin-bottom: 0.5rem;
            align-items: center;
            border: 1px solid #fca5a5;
        }

        .item-name {
            font-weight: 600;
            flex: 1;
            min-width: 160px;
            color: #3b2f1e;
        }

        .settings-item input {
            width: 85px;
            padding: 0.4rem;
            border: 2px solid #d1d5db;
            border-radius: 0.8rem;
            text-align: center;
        }

        .unit-label {
            font-size: 0.8rem;
            color: #6b7280;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1c0a0a;
            color: #fca5a5;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-weight: 700;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .flex-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin: 0.5rem 0 1rem;
        }

        #importInput {
            display: none;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <h1>🔥 ALFAM SHAWARMA</h1>
        <div style="text-align:center"><span class="subhead">Final v3.0 · 12 Shawarmas · Restaurant Grade</span></div>

        <div class="control-panel">
            <div class="input-group">
                <label>🌯</label>
                <input type="number" id="shawarmaQty" value="12" min="1" max="200" step="1">
                <span style="color:#fca5a5; font-weight:bold;">Shawarmas</span>
            </div>
            <button class="btn" id="applyBtn"><span>🔄</span> Calculate</button>
            <button class="btn btn-settings" id="settingsBtn">⚙️ Price Settings</button>
            <button class="btn btn-export" id="exportBtn">⬇️ Export JSON</button>
            <button class="btn btn-import" id="importBtn">📂 Import JSON</button>
            <input type="file" id="importInput" accept=".json">
        </div>

        <div class="tabs" id="tabContainer">
            <button id="tabFull" class="tab active">🌯 Full Recipe</button>
            <button id="tabStep1" class="tab">🍋 Step 1-2</button>
            <button id="tabStep6" class="tab">🧈 Step 6 Glaze</button>
            <button id="tabMayo" class="tab">🔥 Mayo</button>
            <button id="tabVeg" class="tab">🥗 Veg</button>
            <button id="tabAssembly" class="tab">📋 Assembly</button>
            <button id="tabSOP" class="tab">⭐ SOP</button>
        </div>

        <div id="dynamicRecipe" class="recipe-card"></div>
        <div class="footer-note">⭐ Marinate 12-18h · Air Fry 180°C · Glaze + Mayo = Restaurant Quality</div>
    </div>

    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-modal">
            <h2>⚙️ Ingredient Price Settings <button class="close-btn" id="closeSettings">✕</button></h2>
            <div id="settingsList"></div>
            <button class="btn" id="saveSettings" style="margin-top:1rem;">💾 Save & Apply</button>
        </div>
    </div>

    <script>
        (function () {
            const BASE_QTY = 12;
            const CHICKEN_PER_SHAWARMA = 100;

            // ---- RECIPE DEFINITIONS (mutable) ----
            let STEP1 = {
                name: "STEP 1 – First Marination (20-30 min)",
                items: [
                    { name: "Lemon Juice", gram: 28 }, { name: "Salt", gram: 16 },
                    { name: "Ginger Garlic Paste", gram: 45 }, { name: "Kashmiri Chilli Powder", gram: 8 }
                ]
            };
            let STEP2 = {
                name: "STEP 2 – Main Alfam Marination (12-18h)",
                items: [
                    { name: "Hung Curd", gram: 120 }, { name: "Mayonnaise", gram: 100 },
                    { name: "Fresh Cream", gram: 60 }, { name: "Melted Butter", gram: 30 },
                    { name: "Mustard Oil", gram: 35 }, { name: "Milk Powder", gram: 20 },
                    { name: "Corn Flour", gram: 10 }, { name: "Rice Flour", gram: 5 },
                    { name: "Dana Masala / Resham Patti", gram: 16 }, { name: "Kashmiri Chilli Powder", gram: 12 },
                    { name: "Paprika", gram: 8 }, { name: "Coriander Powder", gram: 8 },
                    { name: "Cumin Powder", gram: 5 }, { name: "Black Pepper Powder", gram: 3 },
                    { name: "White Pepper Powder", gram: 2 }, { name: "Kasuri Methi", gram: 2 },
                    { name: "Turmeric Powder", gram: 1.5 }, { name: "Black Salt", gram: 2 },
                    { name: "MSG", gram: 2 }, { name: "Baking Soda", gram: 1 },
                    { name: "Ginger Garlic Paste", gram: 20 }, { name: "Lemon Juice", gram: 15 }
                ]
            };
            let STEP6 = {
                name: "STEP 6 – Restaurant Secret Chicken Glaze",
                items: [
                    { name: "Concentrated Chicken Stock", gram: 20 }, { name: "Melted Butter", gram: 15 },
                    { name: "Lemon Juice", gram: 4 }, { name: "Alfam Masala", gram: 3 }, { name: "MSG", gram: 0.5 }
                ]
            };
            let EXTRA_ITEMS = [
                { name: "Butter (brush after gas)", gram: 20 }, { name: "Ghee (for coal)", gram: 5 }
            ];

            let MAYO = {
                name: "🔥 Signature Creamy Smoky Shawarma Mayo",
                items: [
                    { name: "Thick Mayonnaise", gram: 250 }, { name: "Fresh Cream", gram: 50 },  // changed 45 → 50
                    { name: "Hung Curd (Thick)", gram: 20 }, { name: "Full Fat Milk", gram: 20 },
                    { name: "Melted Unsalted Butter", gram: 18 }, { name: "Neutral Oil", gram: 8 },
                    { name: "Roasted Garlic Paste", gram: 10 }, { name: "Garlic Powder", gram: 4 },
                    { name: "Roasted Cumin Powder", gram: 2 }, { name: "Smoked Paprika", gram: 3 },
                    { name: "White Pepper Powder", gram: 2 }, { name: "Black Pepper Powder", gram: 1 },
                    { name: "Salt", gram: 2 }, { name: "Sugar", gram: 4 }, { name: "Honey", gram: 5 },
                    { name: "MSG", gram: 1.5 }, { name: "Burnt Onion Paste", gram: 10 },
                    { name: "Paprika", gram: 2 }, { name: "Lemon Juice", gram: 6 },
                    { name: "White Vinegar", gram: 1 }, { name: "Cheddar Cheese Powder", gram: 4 },
                    { name: "Butter Flavor Powder", gram: 1 }, { name: "Ghee (for coal smoke)", gram: 4 }
                ]
            };

            let VEG_STRATEGY = {
                name: "🥗 Final Veg Strategy (Per Shawarma)",
                items: [
                    { name: "Iceberg Lettuce (Thin Shredded)", gram: 15 }, { name: "Pickled Onion", gram: 12 },
                    { name: "Green Capsicum (Thin Julienne)", gram: 5 }, { name: "Pickled Jalapeño", gram: 6 },
                    { name: "Fresh Coriander (Finely Chopped)", gram: 2 }, { name: "Fresh Mint Leaves (Thin Chiffonade)", gram: 1 }
                ]
            };

            // ---- GLOBAL STATE ----
            const dynamicDiv = document.getElementById('dynamicRecipe');
            const qtyInput = document.getElementById('shawarmaQty');
            const settingsOverlay = document.getElementById('settingsOverlay');
            const settingsList = document.getElementById('settingsList');

            // collect all ingredient names for settings
            function getAllIngredientNames() {
                const set = new Set();
                [STEP1, STEP2, STEP6, MAYO, VEG_STRATEGY].forEach(s => s.items.forEach(i => set.add(i.name)));
                EXTRA_ITEMS.forEach(i => set.add(i.name));
                set.add("Chicken Breast (Boneless)");
                return set;
            }

            const SETTINGS_KEY = 'alfam_v3_price';
            const PREP_KEY = 'alfam_v3_prep';
            const STOCK_KEY = 'alfam_v3_stock';
            const RECIPE_KEY = 'alfam_v3_recipes';

            function loadStore(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (_) { return {}; } }
            function saveStore(k, d) { localStorage.setItem(k, JSON.stringify(d)); }

            let productSettings = loadStore(SETTINGS_KEY);
            let prepStore = loadStore(PREP_KEY);
            let stockStore = loadStore(STOCK_KEY);

            // ---- load recipe from storage if exists ----
            function loadRecipesFromStorage() {
                const stored = localStorage.getItem(RECIPE_KEY);
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        if (parsed.STEP1) STEP1 = parsed.STEP1;
                        if (parsed.STEP2) STEP2 = parsed.STEP2;
                        if (parsed.STEP6) STEP6 = parsed.STEP6;
                        if (parsed.EXTRA_ITEMS) EXTRA_ITEMS = parsed.EXTRA_ITEMS;
                        if (parsed.MAYO) MAYO = parsed.MAYO;
                        if (parsed.VEG_STRATEGY) VEG_STRATEGY = parsed.VEG_STRATEGY;
                        return true;
                    } catch (e) { }
                }
                return false;
            }
            function saveRecipesToStorage() {
                const payload = { STEP1, STEP2, STEP6, EXTRA_ITEMS, MAYO, VEG_STRATEGY };
                saveStore(RECIPE_KEY, payload);
            }

            // load recipes from storage (if any)
            loadRecipesFromStorage();

            // ---- DEFAULTS for price settings ----
            const DEFAULTS = {
                "Chicken Breast (Boneless)": [1000, 320, 280], "Lemon Juice": [200, 60, 55],
                "Salt": [1000, 25, 22], "Ginger Garlic Paste": [200, 80, 70],
                "Kashmiri Chilli Powder": [100, 60, 55], "Hung Curd": [1000, 85, 78],
                "Mayonnaise": [500, 130, 120], "Fresh Cream": [200, 65, 60],
                "Melted Butter": [500, 310, 282], "Mustard Oil": [500, 160, 145],
                "Milk Powder": [500, 130, 118], "Corn Flour": [500, 45, 40],
                "Rice Flour": [500, 50, 45], "Dana Masala / Resham Patti": [100, 90, 82],
                "Paprika": [100, 55, 50], "Coriander Powder": [100, 50, 45],
                "Cumin Powder": [100, 55, 50], "Black Pepper Powder": [100, 80, 72],
                "White Pepper Powder": [50, 70, 65], "Kasuri Methi": [50, 60, 55],
                "Turmeric Powder": [100, 30, 28], "Black Salt": [100, 40, 36],
                "MSG": [50, 40, 38], "Baking Soda": [100, 25, 22],
                "Concentrated Chicken Stock": [500, 80, 72], "Alfam Masala": [100, 85, 78],
                "Butter (brush after gas)": [500, 310, 282], "Ghee (for coal)": [500, 350, 320],
                "Thick Mayonnaise": [500, 145, 132], "Hung Curd (Thick)": [1000, 85, 78],
                "Full Fat Milk": [1000, 65, 60], "Melted Unsalted Butter": [500, 310, 282],
                "Neutral Oil": [1000, 150, 138], "Roasted Garlic Paste": [250, 65, 58],
                "Garlic Powder": [100, 80, 72], "Roasted Cumin Powder": [100, 60, 55],
                "Smoked Paprika": [50, 90, 82], "Sugar": [1000, 50, 45],
                "Honey": [250, 120, 110], "Burnt Onion Paste": [250, 50, 45],
                "White Vinegar": [500, 55, 50], "Cheddar Cheese Powder": [200, 130, 118],
                "Butter Flavor Powder": [100, 150, 138], "Ghee (for coal smoke)": [500, 350, 320],
                "Iceberg Lettuce (Thin Shredded)": [500, 80, 72], "Pickled Onion": [500, 90, 82],
                "Green Capsicum (Thin Julienne)": [500, 60, 55], "Pickled Jalapeño": [500, 120, 110],
                "Fresh Coriander (Finely Chopped)": [100, 25, 22], "Fresh Mint Leaves (Thin Chiffonade)": [100, 30, 28]
            };
            // fill missing
            getAllIngredientNames().forEach(name => {
                if (!productSettings[name] && DEFAULTS[name]) {
                    productSettings[name] = { packWeight: DEFAULTS[name][0], mrp: DEFAULTS[name][1], discounted: DEFAULTS[name][2] };
                }
            });
            saveStore(SETTINGS_KEY, productSettings);

            // ---- helper functions ----
            function storeKey(tab, item) { return tab + '::' + item; }
            function getPrep(t, i) { return !!prepStore[storeKey(t, i)]; }
            function setPrep(t, i, v) { prepStore[storeKey(t, i)] = v; saveStore(PREP_KEY, prepStore); }
            function getStock(t, i) { return !!stockStore[storeKey(t, i)]; }
            function setStock(t, i, v) { stockStore[storeKey(t, i)] = v; saveStore(STOCK_KEY, stockStore); }
            function toggleStock(t, i) { setStock(t, i, !getStock(t, i)); }
            function setAllPrep(t, items, v) { items.forEach(i => setPrep(t, i.name, v)); }
            function setAllStock(t, items, v) { items.forEach(i => setStock(t, i.name, v)); }

            function calc(item, g) {
                let s = productSettings[item];
                if (!s || !s.packWeight) return { mrp: 0, disc: 0 };
                let pm = (s.mrp || 0) / s.packWeight, pd = (s.discounted || s.mrp || 0) / s.packWeight;
                return { mrp: pm * g, disc: pd * g };
            }
            function scale(items, f) { return items.map(i => ({ ...i, gram: parseFloat((i.gram * f).toFixed(2)) })); }

            let currentTab = 'full', currentQty = 12;

            function updateTabs(active) {
                document.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); });
                const tabMap = { full: 'tabFull', step1: 'tabStep1', step6: 'tabStep6', mayo: 'tabMayo', veg: 'tabVeg', assembly: 'tabAssembly', sop: 'tabSOP' };
                let el = document.getElementById(tabMap[active]);
                if (el) el.classList.add('active');
            }

            function renderItemRow(item, tab) {
                let prep = getPrep(tab, item.name), stock = getStock(tab, item.name);
                let c = calc(item.name, item.gram);
                return `<div class="ing-row"><div class="ing-left">
        <input type="checkbox" class="ing-checkbox" data-item="${item.name}" data-tab="${tab}" ${prep ? 'checked' : ''}>
        <span class="ing-name">🧾 ${item.name}</span>
        <span class="status-badge ${stock ? 'available' : 'not-available'}" data-item="${item.name}" data-tab="${tab}">${stock ? '✅ In Stock' : '❌ Out'}</span>
      </div><div style="display:flex;align-items:center;gap:0.5rem;">
        <span class="ing-qty">${item.gram}g</span><span class="ing-cost">₹${c.disc.toFixed(2)}</span>
      </div></div>`;
            }

            function attachEvents(container, tab, items) {
                container.querySelectorAll('.ing-checkbox').forEach(cb => cb.addEventListener('change', function () {
                    setPrep(this.dataset.tab, this.dataset.item, this.checked);
                    renderContent(currentTab, currentQty);
                }));
                container.querySelectorAll('.status-badge').forEach(b => b.addEventListener('click', function () {
                    toggleStock(this.dataset.tab, this.dataset.item);
                    renderContent(currentTab, currentQty);
                }));
                ['mark-all-prep', 'clear-all-prep', 'mark-all-stock', 'clear-all-stock'].forEach(action => {
                    container.querySelector(`[data-action="${action}"]`)?.addEventListener('click', () => {
                        if (action === 'mark-all-prep') setAllPrep(tab, items, true);
                        if (action === 'clear-all-prep') setAllPrep(tab, items, false);
                        if (action === 'mark-all-stock') setAllStock(tab, items, true);
                        if (action === 'clear-all-stock') setAllStock(tab, items, false);
                        renderContent(currentTab, currentQty);
                    });
                });
            }

            function renderMayo(qty) {
                let factor = qty / BASE_QTY, items = scale(MAYO.items, factor);
                let d = 0, m = 0; items.forEach(i => { let c = calc(i.name, i.gram); d += c.disc; m += c.mrp; });
                let html = `<h2>${MAYO.name} <span style="font-size:0.9rem; color:#6b7280;">(~${(400 * factor).toFixed(0)}g total)</span></h2>
      <div class="status-toggle-bar">
        <button data-action="mark-all-prep">✅ All</button><button data-action="clear-all-prep">❌ None</button>
        <button data-action="mark-all-stock">📦 Stock</button><button data-action="clear-all-stock">📦 Out</button>
      </div><div class="ingredient-list">${items.map(i => renderItemRow(i, 'mayo')).join('')}</div>
      <div class="secret-box">⭐ <strong>Burnt Onion Paste:</strong> Onion flame roast → remove burnt layer → blend smooth. 10g use.</div>
      <div class="secret-box">⭐ <strong>Coal Smoke:</strong> 20-25g charcoal + 4g ghee, 60-75 sec smoke.</div>
      <div class="cost-summary">💰 Mayo Cost: ₹${d.toFixed(2)} | Per shawarma (30g): ₹${(d / qty).toFixed(2)}</div>`;
                dynamicDiv.innerHTML = html;
                attachEvents(dynamicDiv, 'mayo', items);
            }

            function renderVeg(qty) {
                let items = scale(VEG_STRATEGY.items, qty);
                let d = 0; items.forEach(i => d += calc(i.name, i.gram).disc);
                let html = `<h2>🥗 Final Veg Strategy <span style="font-size:0.9rem;">(${qty} shawarmas · 41g each)</span></h2>
      <div class="status-toggle-bar">
        <button data-action="mark-all-prep">✅ All</button><button data-action="clear-all-prep">❌ None</button>
        <button data-action="mark-all-stock">📦 Stock</button><button data-action="clear-all-stock">📦 Out</button>
      </div><div class="ingredient-list">${items.map(i => renderItemRow(i, 'veg')).join('')}</div>
      <div class="secret-box">⭐ <strong>Pickled Onion:</strong> Red Onion 500g + Vinegar 200ml + Water 150ml + Sugar 25g + Salt 18g. Refrigerate 24h.</div>
      <div class="cost-summary">💰 Veg Cost: ₹${d.toFixed(2)} | Per shawarma: ₹${(d / qty).toFixed(2)}</div>`;
                dynamicDiv.innerHTML = html;
                attachEvents(dynamicDiv, 'veg', items);
            }

            function renderAssembly() {
                let html = `<h2>📋 Final Assembly Order (10 Steps)</h2>
      <div class="method-box"><h3>STEP 1 – Heat Bread</h3><p>Tawa medium flame, 10-15 sec each side. Soft only, not crispy.</p></div>
      <div class="method-box"><h3>STEP 2 – First Mayo Layer</h3><p>20-22g mayo, center spread, leave 2-3cm border.</p></div>
      <div class="method-box"><h3>STEP 3 – Juicy Alfam Chicken</h3><p>110-120g chicken in straight line.</p></div>
      <div class="method-box"><h3>STEP 4 – Chicken Glaze</h3><p>8-10g glaze drizzle over hot chicken.</p></div>
      <div class="method-box"><h3>STEP 5 – Vegetables</h3><p>Lettuce → Pickled Onion → Capsicum → Jalapeño. Keep centered.</p></div>
      <div class="method-box"><h3>STEP 6 – Final Mayo Drizzle</h3><p>8-10g zig-zag over vegetables.</p></div>
      <div class="method-box"><h3>STEP 7 – Wrap</h3><p>Fold left → right → roll tight from bottom. Don't compress.</p></div>
      <div class="method-box"><h3>STEP 8 – Butter Brush</h3><p>5g melted butter on outer surface.</p></div>
      <div class="method-box"><h3>STEP 9 – Final Toast</h3><p>Medium flame, 45-60 sec, rotate slowly, golden brown.</p></div>
      <div class="method-box"><h3>STEP 10 – Rest & Serve</h3><p>Rest 30-45 sec, cut diagonal, wrap in butter paper, serve immediately.</p></div>`;
                dynamicDiv.innerHTML = html;
            }

            function renderSOP() {
                let html = `<h2>⭐ Commercial Tips & SOP</h2>
      <div class="section-title">🥄 Standard Portion</div>
      <div class="sop-grid">
        <div class="sop-item">Chicken<br>110-120g</div><div class="sop-item">Mayo<br>30g</div>
        <div class="sop-item">Veg<br>41g</div><div class="sop-item">Glaze<br>8-10g</div>
        <div class="sop-item">Butter<br>5g</div><div class="sop-item">Total<br>~200-215g</div>
      </div>
      <div class="section-title">🧊 Cold Holding</div>
      <div class="sop-grid">
        <div class="sop-item">Mayo<br>0-4°C</div><div class="sop-item">Veg<br>2-5°C</div>
        <div class="sop-item">Pickled Onion<br>0-4°C</div><div class="sop-item">Stock<br>0-4°C</div>
      </div>
      <div class="section-title">🔥 Hot Holding</div>
      <div class="sop-grid">
        <div class="sop-item">Chicken<br>60-65°C</div><div class="sop-item">Glaze<br>Hot</div>
        <div class="sop-item">Butter<br>Warm</div>
      </div>
      <div class="section-title">⏱ Prep Schedule</div>
      <div class="method-box"><ul><li><strong>Previous Day:</strong> Marination, Mayo, Pickled Onion, Stock</li><li><strong>Morning:</strong> Cut Veg, Glaze, Cook, Smoke, Slice</li><li><strong>Service:</strong> Heat Chicken, Glaze, Assemble Fresh, Toast & Serve</li></ul></div>
      <div class="section-title">📦 Storage SOP</div>
      <div class="sop-grid">
        <div class="sop-item">Marinated<br>Max 24h</div><div class="sop-item">Cooked<br>Max 4h Hot</div>
        <div class="sop-item">Mayo<br>3-4 Days</div><div class="sop-item">Stock<br>3-4 Days</div>
        <div class="sop-item">Pickled<br>7 Days</div><div class="sop-item">Fresh Veg<br>24h</div>
      </div>
      <div class="chef-tips" style="background:#1c0a0a;color:#fca5a5;padding:1rem;border-radius:1rem;margin:0.8rem 0;">
        <h4>⭐ Chef's Final Tips</h4><ul>
          <li>Weigh every chicken portion</li><li>Use measuring spoon for mayo</li>
          <li>Never guess ingredient quantity</li><li>Taste one batch every day</li>
          <li>Make fresh veg prep daily</li><li>Consistency > occasional perfection</li>
        </ul>
      </div>`;
                dynamicDiv.innerHTML = html;
            }

            function renderFullRecipe(qty) {
                let f = qty / BASE_QTY, chick = CHICKEN_PER_SHAWARMA * qty;
                let cCost = calc("Chicken Breast (Boneless)", chick);
                let s1 = scale(STEP1.items, f), s2 = scale(STEP2.items, f), s6 = scale(STEP6.items, f);
                let ex = [{ ...EXTRA_ITEMS[0], gram: parseFloat((EXTRA_ITEMS[0].gram * f).toFixed(2)) }, { ...EXTRA_ITEMS[1], gram: parseFloat((EXTRA_ITEMS[1].gram * f).toFixed(2)) }];
                let veg = scale(VEG_STRATEGY.items, qty);
                let td = cCost.disc, tm = cCost.mrp;
                function sum(it) { let d = 0, m = 0; it.forEach(i => { let c = calc(i.name, i.gram); d += c.disc; m += c.mrp; }); td += d; tm += m; return { disc: d, mrp: m }; }
                let sc1 = sum(s1), sc2 = sum(s2), sc6 = sum(s6), sce = sum(ex), scv = sum(veg);
                let html = `<div style="background:#fef3c7;padding:1rem;border-radius:1.5rem;margin-bottom:1rem;"><strong>🍗 Chicken:</strong> ${chick}g – ₹${cCost.disc.toFixed(2)}</div>`;
                function block(title, items, cost, tab, bg = '#fff') {
                    return `<div class="step-container" style="background:${bg};"><h3>${title}</h3><div class="status-toggle-bar">
          <button data-action="mark-all-prep">✅ All</button><button data-action="clear-all-prep">❌ None</button>
          <button data-action="mark-all-stock">📦 Stock</button><button data-action="clear-all-stock">📦 Out</button>
        </div><div class="ingredient-list">${items.map(i => renderItemRow(i, tab)).join('')}</div>
        <div class="cost-summary">💰 ₹${cost.disc.toFixed(2)} (MRP ₹${cost.mrp.toFixed(2)})</div></div>`;
                }
                html += block("STEP 1 – First Marination", s1, sc1, 'step1', '#fef9c3');
                html += block("STEP 2 – Main Alfam Marination", s2, sc2, 'step2', '#fff7ed');
                html += `<div class="step-container"><h3>🔥 STEP 3-5 Cooking</h3>${ex.map(i => renderItemRow(i, 'cooking')).join('')}<div class="cost-summary">🧈 ₹${sce.disc.toFixed(2)}</div></div>`;
                html += block("STEP 6 – Secret Glaze", s6, sc6, 'step6', '#f0fdf4');
                html += block("🥗 Veg Strategy", veg, scv, 'veg', '#dcfce7');
                html += `<div class="total-cost-box"><div style="display:flex;justify-content:space-between;"><span>🎯 Total (${qty}):</span><span style="font-size:1.4rem;">₹${td.toFixed(2)}</span></div>
        <div style="display:flex;justify-content:space-between;"><span>📊 MRP:</span><span>₹${tm.toFixed(2)}</span></div>
        <div style="display:flex;justify-content:space-between;"><span>🌯 Per Shawarma:</span><span>₹${(td / qty).toFixed(2)}</span></div></div>`;
                dynamicDiv.innerHTML = html;
                attachEvents(dynamicDiv, 'step1', s1); attachEvents(dynamicDiv, 'step2', s2);
                attachEvents(dynamicDiv, 'step6', s6); attachEvents(dynamicDiv, 'cooking', ex);
                attachEvents(dynamicDiv, 'veg', veg);
            }

            function renderStepOnly(stepObj, qty, tabKey) {
                let f = qty / BASE_QTY, items = scale(stepObj.items, f);
                let d = 0; items.forEach(i => d += calc(i.name, i.gram).disc);
                let html = `<h2>${stepObj.name}</h2><div class="status-toggle-bar">
        <button data-action="mark-all-prep">✅ All</button><button data-action="clear-all-prep">❌ None</button>
        <button data-action="mark-all-stock">📦 Stock</button><button data-action="clear-all-stock">📦 Out</button>
      </div><div class="ingredient-list">${items.map(i => renderItemRow(i, tabKey)).join('')}</div>
      <div class="cost-summary">💰 ₹${d.toFixed(2)}</div>`;
                dynamicDiv.innerHTML = html;
                attachEvents(dynamicDiv, tabKey, items);
            }

            function renderContent(tab, qty) {
                if (tab === 'full') renderFullRecipe(qty);
                else if (tab === 'step1') {
                    let items = [...scale(STEP1.items, qty / BASE_QTY), ...scale(STEP2.items, qty / BASE_QTY)];
                    let d = 0; items.forEach(i => d += calc(i.name, i.gram).disc);
                    dynamicDiv.innerHTML = `<h2>STEP 1-2 Marination</h2><div class="status-toggle-bar"><button data-action="mark-all-prep">✅ All</button><button data-action="clear-all-prep">❌ None</button><button data-action="mark-all-stock">📦 Stock</button><button data-action="clear-all-stock">📦 Out</button></div><div class="ingredient-list">${items.map(i => renderItemRow(i, 'step1')).join('')}</div><div class="cost-summary">💰 ₹${d.toFixed(2)}</div>`;
                    attachEvents(dynamicDiv, 'step1', items);
                } else if (tab === 'step6') renderStepOnly(STEP6, qty, 'step6');
                else if (tab === 'mayo') renderMayo(qty);
                else if (tab === 'veg') renderVeg(qty);
                else if (tab === 'assembly') renderAssembly();
                else if (tab === 'sop') renderSOP();
            }

            // ---- Settings UI ----
            function renderSettings() {
                const names = getAllIngredientNames();
                settingsList.innerHTML = [...names].sort().map(name => {
                    let s = productSettings[name] || { packWeight: '', mrp: '', discounted: '' };
                    return `<div class="settings-item"><span class="item-name">${name}</span>
          <input class="set-pack" data-name="${name}" value="${s.packWeight || ''}" placeholder="Pack g" style="width:85px;"><span class="unit-label">g</span>
          <input class="set-mrp" data-name="${name}" value="${s.mrp || ''}" placeholder="MRP ₹" style="width:85px;">
          <input class="set-disc" data-name="${name}" value="${s.discounted || ''}" placeholder="Disc ₹" style="width:85px;"></div>`;
                }).join('');
            }

            function saveFromUI() {
                document.querySelectorAll('.settings-item').forEach(el => {
                    let n = el.querySelector('.set-pack').dataset.name;
                    let p = parseFloat(el.querySelector('.set-pack').value) || 0;
                    let m = parseFloat(el.querySelector('.set-mrp').value) || 0;
                    let d = parseFloat(el.querySelector('.set-disc').value) || 0;
                    if (p > 0) productSettings[n] = { packWeight: p, mrp: m, discounted: d };
                    else delete productSettings[n];
                });
                saveStore(SETTINGS_KEY, productSettings);
                settingsOverlay.classList.remove('open');
                renderContent(currentTab, currentQty);
                showToast('✅ Settings saved!');
            }

            function showToast(msg) {
                let t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
                document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
            }

            // ---- EXPORT / IMPORT ----
            function exportJSON() {
                const payload = {
                    recipes: { STEP1, STEP2, STEP6, EXTRA_ITEMS, MAYO, VEG_STRATEGY },
                    prices: productSettings,
                    prep: prepStore,
                    stock: stockStore
                };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `alfam_shawarma_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('📦 Exported!');
            }

            function importJSON(file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.recipes) {
                            if (data.recipes.STEP1) STEP1 = data.recipes.STEP1;
                            if (data.recipes.STEP2) STEP2 = data.recipes.STEP2;
                            if (data.recipes.STEP6) STEP6 = data.recipes.STEP6;
                            if (data.recipes.EXTRA_ITEMS) EXTRA_ITEMS = data.recipes.EXTRA_ITEMS;
                            if (data.recipes.MAYO) MAYO = data.recipes.MAYO;
                            if (data.recipes.VEG_STRATEGY) VEG_STRATEGY = data.recipes.VEG_STRATEGY;
                            saveRecipesToStorage();
                        }
                        if (data.prices) {
                            productSettings = data.prices;
                            saveStore(SETTINGS_KEY, productSettings);
                        }
                        if (data.prep) {
                            prepStore = data.prep;
                            saveStore(PREP_KEY, prepStore);
                        }
                        if (data.stock) {
                            stockStore = data.stock;
                            saveStore(STOCK_KEY, stockStore);
                        }
                        renderContent(currentTab, currentQty);
                        showToast('✅ Import successful!');
                    } catch (err) {
                        showToast('❌ Invalid JSON file');
                        console.error(err);
                    }
                };
                reader.readAsText(file);
            }

            // ---- EVENT BINDING ----
            document.getElementById('applyBtn').onclick = () => {
                let q = parseInt(qtyInput.value, 10);
                if (isNaN(q) || q < 1) q = 1; if (q > 200) q = 200;
                qtyInput.value = q; currentQty = q; renderContent(currentTab, currentQty);
            };
            document.getElementById('tabFull').onclick = () => { currentTab = 'full'; updateTabs('full'); renderContent('full', currentQty); };
            document.getElementById('tabStep1').onclick = () => { currentTab = 'step1'; updateTabs('step1'); renderContent('step1', currentQty); };
            document.getElementById('tabStep6').onclick = () => { currentTab = 'step6'; updateTabs('step6'); renderContent('step6', currentQty); };
            document.getElementById('tabMayo').onclick = () => { currentTab = 'mayo'; updateTabs('mayo'); renderContent('mayo', currentQty); };
            document.getElementById('tabVeg').onclick = () => { currentTab = 'veg'; updateTabs('veg'); renderContent('veg', currentQty); };
            document.getElementById('tabAssembly').onclick = () => { currentTab = 'assembly'; updateTabs('assembly'); renderContent('assembly', currentQty); };
            document.getElementById('tabSOP').onclick = () => { currentTab = 'sop'; updateTabs('sop'); renderContent('sop', currentQty); };
            document.getElementById('settingsBtn').onclick = () => { renderSettings(); settingsOverlay.classList.add('open'); };
            document.getElementById('closeSettings').onclick = () => settingsOverlay.classList.remove('open');
            document.getElementById('saveSettings').onclick = saveFromUI;
            settingsOverlay.onclick = e => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('open'); };

            document.getElementById('exportBtn').onclick = exportJSON;
            document.getElementById('importBtn').onclick = () => document.getElementById('importInput').click();
            document.getElementById('importInput').onchange = function (e) {
                if (this.files && this.files[0]) {
                    importJSON(this.files[0]);
                }
                this.value = '';
            };

            // initial render
            updateTabs('full');
            renderContent('full', 12);
        })();
    </script>
</body>

</html>
